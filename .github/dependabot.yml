version: 2
updates:
  # This repository holds only GitHub Actions workflows and documentation: there are no
  # NuGet (or other) package manifests, so github-actions is the only ecosystem.
  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
